name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Assemble debug APK (retry transient dependency rate limits)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 :app:assembleDebug; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Build attempt $attempt failed; retrying..."
            sleep "$((attempt * 25))"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UAPlay-Android-TV-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download in repository
        shell: bash
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/UAPlay-Android-TV-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/UAPlay-Android-TV-test.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: publish Android TV test APK [skip ci]"
          git push origin HEAD:main
